name: Collect dashboard data (PAT)

# Template collection path. It does not need the ScienceDiscovery bot or OIDC
# broker: a source token reads the source repository, and GITHUB_TOKEN writes
# the generated site/ back to this dashboard repository.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    # Collection is opt-in: set repository variable BOARD_COLLECT=true
    # (Settings -> Secrets and variables -> Actions -> Variables) to run it.
    # This deployment publishes a private source on purpose, so enabling the
    # switch makes its PR titles, issues and test names public.
    if: vars.BOARD_COLLECT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve configured source
        id: context
        run: python3 collection_context.py
      - name: Collect source and publish snapshot
        env:
          # Read-only token for the private source repository.
          GITHUB_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          # Contents-write token for this dashboard repository.
          GSB_PUBLISH_TOKEN: ${{ github.token }}
          # Explicit opt-in: the board must not publish a private source by accident.
          GSB_ALLOW_PRIVATE_PUBLISH: '1'
        run: |
          args=(--repo "${{ steps.context.outputs.source }}" --publish-repo "${{ github.repository }}")
          if [ -f .sync/state.json ]; then
            args+=(--incremental)
          fi
          python3 publish.py "${args[@]}"
      # The site commit is made with GITHUB_TOKEN, whose push does not trigger
      # pages.yml. pages.yml listens for this workflow's completion instead.
